# GitHub Actions 工作流 - 自动化部署
# 触发条件：推送到 main 分支
# 部署方式：Nuxt 4（Nitro .output）+ PM2 零停机 reload
# 包管理：仅 pnpm；运行端口：3001（见 ecosystem.config.cjs）
# 业务环境变量：仅使用 Secret ENV_PRODUCTION_YUNFENG（多行 KEY=value，含 DATABASE_URL / NotifyX）

name: Deploy yunfeng

on:
  push:
    branches: [main] # 如果你的默认分支是 master，请改为 master

# 同一工作流串行部署：连续 push 排队，不取消进行中的任务（避免 rsync/reload 交叉）
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4.4.0

      # 2. 设置 pnpm（版本以 package.json 的 packageManager 为准，此处勿再写 version）
      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0

      # 3. 设置 Node.js 版本（与服务器保持一致）
      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: pnpm

      # 4. 安装依赖（包括 devDependencies，因为构建需要；锁定 pnpm-lock.yaml）
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. 校验生产 Secret 已配置（构建期不写 .env，避免把密钥编进 .output）
      #    - 须含 DATABASE_URL=mysql://...（勿再用 DB_HOST 等拆项）
      #    - 密钥只在步骤 9 写入服务器 .runtime.env，由 PM2 运行时注入 NUXT_*
      - name: Check production secrets
        env:
          ENV_PRODUCTION_YUNFENG: ${{ secrets.ENV_PRODUCTION_YUNFENG }}
        run: |
          if [ -z "$ENV_PRODUCTION_YUNFENG" ]; then
            echo "❌ Secret ENV_PRODUCTION_YUNFENG 未配置（请粘贴与本地 .env.production 相同的多行 KEY=value）"
            exit 1
          fi
          # 必须有 DATABASE_URL（或已写 NUXT_DATABASE_URL）；旧版 DB_HOST 等已废弃
          if ! printf '%s\n' "$ENV_PRODUCTION_YUNFENG" | grep -E -q '^(DATABASE_URL|NUXT_DATABASE_URL)=mysql://'; then
            echo "❌ Secret 缺少 DATABASE_URL=mysql://user:pass@host:port/db（请更新 ENV_PRODUCTION_YUNFENG）"
            exit 1
          fi
          if printf '%s\n' "$ENV_PRODUCTION_YUNFENG" | grep -E -q '^DB_(HOST|PORT|USER|PASSWORD|NAME)='; then
            echo "⚠️  检测到旧版 DB_* 拆项，已忽略；请改用 DATABASE_URL 后删除这些行"
          fi
          echo "✅ ENV_PRODUCTION_YUNFENG is set（含 DATABASE_URL，将写入服务器 .runtime.env）"

      # 6. 构建 Nuxt 应用（Nitro node-server）
      #    产物位于 .output/ 目录（入口：.output/server/index.mjs）
      #    不注入 DB/NotifyX 等密钥，runtimeConfig 敏感项保持空默认值
      - name: Build Nuxt app
        run: pnpm build
        env:
          # 构建预设；端口仅影响运行时，由 PM2 / ecosystem 管理
          NITRO_PRESET: node-server

      # 6.1 校验产物，避免把残缺构建同步到服务器；并抽查敏感串未被编入
      - name: Verify build output
        env:
          ENV_PRODUCTION_YUNFENG: ${{ secrets.ENV_PRODUCTION_YUNFENG }}
        run: |
          test -f .output/server/index.mjs || (echo "❌ missing .output/server/index.mjs" && exit 1)
          test -d .output/public || (echo "❌ missing .output/public" && exit 1)
          # 若 Secret 里含 DATABASE_URL=mysql://user:pass@...，抽查密码段未编进产物
          uri=$(printf '%s\n' "$ENV_PRODUCTION_YUNFENG" | sed -n 's/^DATABASE_URL=//p' | head -1)
          pw=$(printf '%s' "$uri" | sed -n 's|^[^:]*://[^:]*:\([^@]*\)@.*|\1|p')
          # URL 编码的密码还原后再搜（常见 %40 → @）
          if [ -n "$pw" ]; then
            pw_decoded=$(printf '%s' "$pw" | sed 's/%40/@/g; s/%3A/:/g; s/%2F/\//g; s/%23/#/g')
            if grep -R -F -q -- "$pw" .output/server || grep -R -F -q -- "$pw_decoded" .output/server; then
              echo "❌ DATABASE_URL 中的密码出现在构建产物中，请检查 nuxt.config runtimeConfig"
              exit 1
            fi
          fi
          echo "✅ Nuxt build output OK（未检出 DATABASE_URL 密码泄漏）"

      # 7. 上传构建产物到 staging（先不碰线上目录，避免 --delete 误伤）
      #    - .output/ 内容同步到 /server/yunfeng.staging/
      #    - 排除 .env.*、.runtime.env、ecosystem、logs
      - name: Deploy build output to staging via rsync
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avzr --delete --exclude='.env' --exclude='.env.*' --exclude='.runtime.env' --exclude='ecosystem.config.cjs' --exclude='logs'
          path: .output/
          remote_path: /server/yunfeng.staging/
          remote_host: ${{ secrets.HOST }}
          remote_user: ${{ secrets.USER }}
          remote_key: ${{ secrets.SSH_KEY }}

      # 8. 上传 ecosystem.config.cjs 到 staging
      - name: Deploy ecosystem.config.cjs to staging via rsync
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avz
          path: ecosystem.config.cjs
          remote_path: /server/yunfeng.staging/
          remote_host: ${{ secrets.HOST }}
          remote_user: ${{ secrets.USER }}
          remote_key: ${{ secrets.SSH_KEY }}

      # 9. 远程校验 staging → 写入密钥 → 原子切换到 /server/yunfeng → pm2 reload
      - name: Promote staging and reload PM2
        uses: appleboy/ssh-action@v1.2.0
        env:
          ENV_PRODUCTION_YUNFENG: ${{ secrets.ENV_PRODUCTION_YUNFENG }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: ENV_PRODUCTION_YUNFENG
          command_timeout: 60s
          script: |
            set -e
            LIVE=/server/yunfeng
            STAGING=/server/yunfeng.staging
            PREV=/server/yunfeng.prev

            if [ ! -f "$STAGING/server/index.mjs" ]; then
              echo "❌ Error: server/index.mjs not found in $STAGING"
              exit 1
            fi
            if [ ! -d "$STAGING/public" ]; then
              echo "❌ Error: public/ not found in $STAGING"
              exit 1
            fi
            if [ ! -f "$STAGING/ecosystem.config.cjs" ]; then
              echo "❌ Error: ecosystem.config.cjs not found in $STAGING"
              exit 1
            fi
            if [ -z "$ENV_PRODUCTION_YUNFENG" ]; then
              echo "❌ ENV_PRODUCTION_YUNFENG empty"
              exit 1
            fi
            # 远程再校验一次：必须有可用的 MySQL URI
            if ! printf '%s\n' "$ENV_PRODUCTION_YUNFENG" | grep -E -q '^(DATABASE_URL|NUXT_DATABASE_URL)=mysql://'; then
              echo "❌ ENV_PRODUCTION_YUNFENG 缺少 DATABASE_URL=mysql://..."
              exit 1
            fi

            umask 077
            {
              printf '%s\n' "$ENV_PRODUCTION_YUNFENG"
              # 为裸 DATABASE_URL / NOTIFYX_KEY 补 NUXT_ 别名（runtimeConfig 只认 NUXT_）
              printf '%s\n' "$ENV_PRODUCTION_YUNFENG" | while IFS= read -r line || [ -n "$line" ]; do
                trimmed=$(printf '%s' "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
                case "$trimmed" in
                  ''|\#*) continue ;;
                esac
                key=${trimmed%%=*}
                val=${trimmed#*=}
                case "$key" in
                  DATABASE_URL) printf 'NUXT_DATABASE_URL=%s\n' "$val" ;;
                  NOTIFYX_KEY) printf 'NUXT_NOTIFYX_KEY=%s\n' "$val" ;;
                esac
              done
            } > "$STAGING/.runtime.env"
            echo "✅ wrote staging .runtime.env（DATABASE_URL → NUXT_DATABASE_URL）"

            mkdir -p "$STAGING/logs"
            if [ -d "$LIVE/logs" ]; then
              cp -a "$LIVE/logs/." "$STAGING/logs/" 2>/dev/null || true
            fi

            rm -rf "$PREV"
            if [ -d "$LIVE" ]; then
              mv "$LIVE" "$PREV"
            fi
            mv "$STAGING" "$LIVE"
            echo "✅ promoted $STAGING → $LIVE"

            cd "$LIVE"
            echo "🔄 Attempting zero-downtime reload..."
            pm2 reload ecosystem.config.cjs --update-env || \
              (echo "⚠️  Reload failed, falling back to restart..." && pm2 startOrRestart ecosystem.config.cjs --update-env)

            pm2 save
            echo "✅ Deployment completed successfully (port 3001)"
